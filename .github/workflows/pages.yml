name: Flutter Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source zip if present
        run: |
          set -e
          Z=$(find . -maxdepth 2 -type f \( -name '*.zip' -o -name '*.ZIP' \) | head -n 1 || true)
          if [ -n "$Z" ]; then
            echo "Found zip: $Z"
            mkdir -p _src
            unzip -q -o "$Z" -d _src
            # Prefer folder that already has pubspec.yaml
            ROOT=$(find _src -type f -name pubspec.yaml | head -n 1 | xargs dirname || true)
            if [ -z "$ROOT" ]; then
              echo "No pubspec.yaml inside zip"
              find _src | head -80
              exit 1
            fi
            echo "Using Flutter project root: $ROOT"
            # Move project files to workspace root (keep .github)
            shopt -s dotglob
            for item in "$ROOT"/*; do
              base=$(basename "$item")
              if [ "$base" = ".github" ]; then continue; fi
              rm -rf "./$base"
              mv "$item" .
            done
          else
            echo "No zip — expecting Flutter source already in repo root"
          fi
          test -f pubspec.yaml || { echo "pubspec.yaml missing"; ls -la; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release --base-href "/ludo-web-preview/"
          touch build/web/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          enable_jekyll: false
