name: Deploy Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract web zip to site/
        run: |
          set -e
          rm -rf site
          mkdir -p site

          Z=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1 || true)
          if [ -z "$Z" ]; then
            echo "No zip found"
            ls -la
            exit 1
          fi
          echo "Found zip: $Z"
          mkdir -p _extract
          unzip -q -o "$Z" -d _extract

          WEB=$(find _extract -type f -name index.html | head -n 1 || true)
          if [ -z "$WEB" ]; then
            echo "No index.html in zip"
            find _extract | head -50
            exit 1
          fi
          WEB_DIR=$(dirname "$WEB")
          echo "Using: $WEB_DIR"
          cp -a "$WEB_DIR"/. site/

          sed -i 's|<base href="[^"]*">|<base href="/ludo-web-preview/">|' site/index.html || true
          touch site/.nojekyll
          grep -n 'base href' site/index.html || true
          ls -la site | head -20

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
